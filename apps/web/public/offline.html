<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>Tennis</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF7F2;
      color: #1a1a1a;
      font-family: "Source Sans 3", system-ui, sans-serif;
    }
    main { padding: 32px 24px; text-align: center; max-width: 280px; }
    p { margin: 12px 0 0; font-size: 15px; line-height: 1.4; color: rgba(26, 26, 26, 0.7); }
    button {
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      background: #1a1a1a;
      color: #FAF7F2;
      padding: 12px 22px;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="56" height="56" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#3A8A7A"/>
      <circle cx="16" cy="16" r="10" fill="#D4E040"/>
      <path d="M9.2 11.2c2.4 1.5 3.8 3.2 3.8 4.8s-1.4 3.3-3.8 4.8" fill="none" stroke="#FAF7F2" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M22.8 11.2c-2.4 1.5-3.8 3.2-3.8 4.8s1.4 3.3 3.8 4.8" fill="none" stroke="#FAF7F2" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <p>No connection. Check the network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
